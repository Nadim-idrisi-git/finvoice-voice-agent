services:
  - type: web
    name: voice-financial-agent-api
    runtime: node
    buildCommand: npm run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_VOICE
        value: Kore
