# Render Blueprint: New → Blueprint → select this repo. Secrets marked sync: false are entered in the dashboard.
services:
  - type: web
    name: finvoice-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Serve the synthetic demo API in production (no real users or bank data).
      - key: DEMO_MODE
        value: "true"
      # Allowed frontend origins; the wildcard covers the Vercel production and preview URLs.
      - key: WEB_ORIGIN
        value: https://finvoice*.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_VOICE
        value: Kore
