# Render Blueprint: New → Blueprint → select this repo. Secrets marked sync: false are entered in the dashboard.
services:
  - type: web
    name: finvoice-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Serve the synthetic demo API in production (no real users or bank data).
      - key: DEMO_MODE
        value: "true"
      # Allowed frontend origins; the wildcard covers the Vercel production and preview URLs.
      - key: WEB_ORIGIN
        value: https://finvoice*.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_VOICE
        value: marin
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
